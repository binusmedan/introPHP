                                <div key={judul} className="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
                                    <span className="grid h-8 w-8 place-items-center rounded-lg bg-violet-100 text-sm font-extrabold text-violet-700">{nomor}</span>
                                    <h4 className="mt-3 font-extrabold text-slate-900">{judul}</h4>
                                    <p className="mt-1 text-sm leading-6 text-slate-600">{teks}</p>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        }

        async function salinTeksPraktik(teks) {
            if (navigator.clipboard && window.isSecureContext) {
                await navigator.clipboard.writeText(teks);
                return;
            }

            const areaTeks = document.createElement("textarea");
            areaTeks.value = teks;
            areaTeks.style.position = "fixed";
            areaTeks.style.opacity = "0";
            document.body.appendChild(areaTeks);
            areaTeks.select();
            document.execCommand("copy");
            areaTeks.remove();
        }

        function BlokKodePraktik({ kode, label, onSalin, tersalin }) {
            return (
                <div className="overflow-hidden rounded-2xl border border-slate-700 bg-slate-950 shadow-xl">
                    <div className="flex items-center justify-between gap-3 border-b border-slate-800 bg-slate-900 px-4 py-3">
                        <div className="flex min-w-0 items-center gap-3">
                            <span className="flex gap-1.5" aria-hidden="true">
                                <i className="h-2.5 w-2.5 rounded-full bg-rose-400" />
                                <i className="h-2.5 w-2.5 rounded-full bg-amber-400" />
                                <i className="h-2.5 w-2.5 rounded-full bg-emerald-400" />
                            </span>
                            <span className="truncate font-mono text-xs font-bold text-slate-400">{label}</span>
                        </div>
                        <button type="button" onClick={onSalin} className={`${tersalin ? "border-emerald-700 bg-emerald-900 text-emerald-200" : "border-slate-700 bg-slate-800 text-slate-200 hover:bg-slate-700"} inline-flex shrink-0 items-center gap-2 rounded-lg border px-3 py-2 text-xs font-extrabold transition`}>
                            {tersalin ? <Check size={15} /> : <Code2 size={15} />}
                            {tersalin ? "Tersalin" : "Salin Kode"}
                        </button>
                    </div>
                    <pre className="max-h-[430px] overflow-auto p-5 text-sm leading-7 text-slate-200"><code>{kode}</code></pre>
                </div>
            );
        }

        function KartuStudiKasus({ data }) {
            const [tampilan, setTampilan] = useState("tantangan");
            const [tersalin, setTersalin] = useState("");
            const warna = {
                sky: {
                    kepala: "from-sky-500 to-cyan-500",
                    lembut: "bg-sky-50 border-sky-200 text-sky-800",
                    nomor: "text-sky-700 bg-sky-100",
                    tombol: "bg-sky-600 hover:bg-sky-700 shadow-sky-100"
                },
                violet: {
                    kepala: "from-violet-500 to-fuchsia-500",
                    lembut: "bg-violet-50 border-violet-200 text-violet-800",
                    nomor: "text-violet-700 bg-violet-100",
                    tombol: "bg-violet-600 hover:bg-violet-700 shadow-violet-100"
                },
                emerald: {
                    kepala: "from-emerald-500 to-teal-500",
                    lembut: "bg-emerald-50 border-emerald-200 text-emerald-800",
                    nomor: "text-emerald-700 bg-emerald-100",
                    tombol: "bg-emerald-600 hover:bg-emerald-700 shadow-emerald-100"
                }
            }[data.warna];

            async function salin(kode, jenis) {
                try {
                    await salinTeksPraktik(kode);
                    setTersalin(jenis);
                    setTimeout(() => setTersalin(""), 1800);
                } catch {
                    setTersalin("");
                }
            }

            const tab = [
                ["tantangan", "Tantangan", MousePointerClick],
                ["petunjuk", "Petunjuk", Lightbulb],
                ["solusi", "Solusi", CheckCircle2]
            ];

            return (
                <article className="overflow-hidden rounded-[1.75rem] border border-slate-200 bg-white shadow-xl shadow-slate-200/60">
                    <div className={`bg-gradient-to-r ${warna.kepala} p-6 text-white md:p-8`}>
                        <div className="flex flex-col gap-5 sm:flex-row sm:items-start sm:justify-between">
                            <div className="flex items-start gap-4">
                                <span className="grid h-12 w-12 shrink-0 place-items-center rounded-2xl bg-white/20 text-lg font-extrabold ring-1 ring-white/30">{data.nomor}</span>
                                <div>
                                    <div className="flex flex-wrap items-center gap-2">
                                        <span className="rounded-full bg-white/20 px-3 py-1 text-xs font-extrabold ring-1 ring-white/25">{data.tingkat}</span>
                                        <span className="rounded-full bg-slate-950/20 px-3 py-1 text-xs font-bold">{data.konsep}</span>
                                    </div>
                                    <h3 className="mt-3 text-2xl font-extrabold tracking-tight md:text-3xl">{data.judul}</h3>
                                </div>
                            </div>
                            <div className="flex shrink-0 items-center gap-2 rounded-xl bg-white/15 px-3 py-2 text-xs font-bold ring-1 ring-white/25">
                                <Code2 size={16} /> {data.namaFile}
                            </div>
                        </div>
                    </div>

                    <div className="border-b border-slate-200 bg-slate-50 p-2 sm:p-3">
                        <div className="grid grid-cols-3 gap-1" role="tablist" aria-label={`Bagian studi kasus ${data.judul}`}>
                            {tab.map(([id, label, Ikon]) => (
                                <button
                                    key={id}
                                    type="button"
                                    role="tab"
                                    aria-selected={tampilan === id}
                                    onClick={() => setTampilan(id)}
                                    className={`${tampilan === id ? "bg-white text-slate-900 shadow-sm ring-1 ring-slate-200" : "text-slate-500 hover:bg-white/70 hover:text-slate-700"} inline-flex items-center justify-center gap-2 rounded-xl px-2 py-3 text-xs font-extrabold transition sm:text-sm`}
                                >
                                    <Ikon size={17} aria-hidden="true" />
                                    {label}
                                </button>
                            ))}
                        </div>
                    </div>

                    <div className="p-5 sm:p-7 md:p-8">
                        {tampilan === "tantangan" && (
                            <div role="tabpanel">
                                <div className="grid gap-5 lg:grid-cols-[1fr_1.15fr]">
                                    <div>
                                        <div className={`${warna.lembut} rounded-2xl border p-5`}>
                                            <p className="text-xs font-extrabold uppercase tracking-wider opacity-70">Cerita Kasus</p>
                                            <p className="mt-2 text-sm font-semibold leading-7">{data.cerita}</p>
                                        </div>
                                        <div className="mt-5">
                                            <h4 className="font-extrabold text-slate-900">Yang perlu kamu buat</h4>
                                            <p className="mt-2 text-sm leading-7 text-slate-600">{data.tujuan}</p>
                                        </div>
                                        <ol className="mt-5 space-y-3">
                                            {data.langkah.map((langkah, indeks) => (
                                                <li key={langkah} className="flex gap-3 text-sm leading-6 text-slate-600">
                                                    <span className={`${warna.nomor} grid h-7 w-7 shrink-0 place-items-center rounded-lg text-xs font-extrabold`}>{indeks + 1}</span>
                                                    {langkah}
                                                </li>
                                            ))}
                                        </ol>
                                        <div className="mt-5 rounded-xl border border-slate-200 bg-slate-50 p-4 text-sm leading-6 text-slate-600">
                                            <strong className="text-slate-900">Contoh keluaran:</strong> {data.keluaran}
                                        </div>
                                    </div>
                                    <BlokKodePraktik kode={data.kodeAwal} label={`Kode awal • ${data.namaFile}`} onSalin={() => salin(data.kodeAwal, "awal")} tersalin={tersalin === "awal"} />
                                </div>
                            </div>
                        )}

                        {tampilan === "petunjuk" && (
                            <div role="tabpanel" className="mx-auto max-w-3xl">
                                <div className="mb-6 text-center">
                                    <span className="mx-auto grid h-14 w-14 place-items-center rounded-2xl bg-amber-100 text-amber-700"><Lightbulb size={28} /></span>
                                    <h4 className="mt-4 text-xl font-extrabold text-slate-900">Coba satu petunjuk dahulu</h4>
                                    <p className="mt-2 text-sm text-slate-500">Jangan langsung membuka solusi. Baca petunjuk dari atas ke bawah sesuai kebutuhan.</p>
                                </div>
                                <div className="space-y-3">
                                    {data.petunjuk.map((petunjuk, indeks) => (
                                        <div key={petunjuk} className="flex items-start gap-4 rounded-2xl border border-amber-200 bg-amber-50 p-5 text-sm leading-7 text-amber-900">
                                            <span className="grid h-8 w-8 shrink-0 place-items-center rounded-xl bg-amber-200 font-extrabold">{indeks + 1}</span>
                                            <p>{petunjuk}</p>
                                        </div>
                                    ))}
                                </div>
                                <button type="button" onClick={() => setTampilan("tantangan")} className={`mt-6 inline-flex w-full items-center justify-center gap-2 rounded-xl ${warna.tombol} px-5 py-3.5 font-extrabold text-white shadow-lg transition`}>
                                    <ArrowRight className="rotate-180" size={18} /> Kembali Mengerjakan
                                </button>
                            </div>
                        )}

                        {tampilan === "solusi" && (
                            <div role="tabpanel">
                                <div className="mb-5 flex items-start gap-3 rounded-2xl border border-emerald-200 bg-emerald-50 p-5 text-sm leading-7 text-emerald-900">
                                    <CheckCircle2 className="mt-0.5 shrink-0" size={22} />
                                    <p><strong>Bandingkan, jangan hanya menyalin.</strong> Perhatikan letak variabel, tanda titik koma, dan urutan logikanya. Setelah paham, ubah sedikit datanya lalu jalankan kembali.</p>
                                </div>
                                <BlokKodePraktik kode={data.solusi} label={`Contoh solusi • ${data.namaFile}`} onSalin={() => salin(data.solusi, "solusi")} tersalin={tersalin === "solusi"} />
                            </div>
                        )}
                    </div>
                </article>
            );
        }

        function BagianPraktikPHP() {
            return (
                <section id="praktik" className="border-y border-emerald-100 bg-gradient-to-b from-emerald-50/60 via-white to-sky-50/50 px-4 py-20 sm:px-6 md:py-28 lg:px-8">
                    <div className="mx-auto max-w-7xl">
                        <JudulBagian
                            nomor="4"
                            label="Praktik PHP Langsung"
                            judul="Tiga Studi Kasus untuk Dicoba"
                            deskripsi="Mulai dari menampilkan teks, lanjut ke keputusan sederhana, lalu membuat kalkulator. Kerjakan berurutan agar setiap konsep terasa lebih mudah."
                        />

                        <div className="mb-8 grid gap-4 rounded-[1.75rem] border border-slate-200 bg-white p-5 shadow-lg sm:grid-cols-3 md:p-7">
                            {[
                                ["1", "Nyalakan Apache", "Buka XAMPP lalu tekan Start pada Apache."],
                                ["2", "Simpan Berkas", "Buat berkas .php di dalam folder htdocs."],
                                ["3", "Buka di Browser", "Ketik localhost/nama-file.php pada alamat Browser."]
                            ].map(([nomor, judul, teks], indeks) => (
                                <div key={judul} className="relative flex gap-3 rounded-2xl bg-slate-50 p-4">
                                    <span className="grid h-9 w-9 shrink-0 place-items-center rounded-xl bg-slate-900 text-sm font-extrabold text-white">{nomor}</span>
                                    <div>
                                        <h3 className="text-sm font-extrabold text-slate-900">{judul}</h3>
                                        <p className="mt-1 text-xs leading-5 text-slate-600">{teks}</p>
                                    </div>
                                    {indeks < 2 && <ChevronRight className="absolute -right-3 top-1/2 z-10 hidden -translate-y-1/2 text-slate-300 sm:block" size={20} aria-hidden="true" />}
                                </div>
                            ))}
                        </div>

                        <div className="space-y-8">
                            {STUDI_KASUS_PHP.map((data) => <KartuStudiKasus key={data.nomor} data={data} />)}
                        </div>

                        <div className="mx-auto mt-8 flex max-w-3xl items-start gap-3 rounded-2xl border border-sky-200 bg-sky-50 p-5 text-sm leading-7 text-sky-900">
                            <Lightbulb className="mt-0.5 shrink-0" size={21} />
                            <p><strong>Cara belajar yang disarankan:</strong> jalankan kode awal, ubah satu bagian, muat ulang Browser, lalu amati hasilnya. Kesalahan kecil adalah bagian normal dari proses belajar.</p>
                        </div>
                    </div>
                </section>
            );
        }

        function KuisAlur() {
            const alurBenar = ["Browser", "PHP", "MySQL", "PHP", "Browser"];
            const [jawaban, setJawaban] = useState([]);
            const [pesan, setPesan] = useState("Mulai dengan memilih bagian yang mengirim permintaan.");
            const [salah, setSalah] = useState(false);
            const [berhasil, setBerhasil] = useState(false);

            const pilihan = [
                ["Browser", Globe2, "bg-sky-100 text-sky-700 border-sky-200 hover:bg-sky-200"],
                ["PHP", ChefHat, "bg-violet-100 text-violet-700 border-violet-200 hover:bg-violet-200"],
                ["MySQL", Database, "bg-amber-100 text-amber-700 border-amber-200 hover:bg-amber-200"]
            ];

            function pilih(nama) {
                if (berhasil) return;
                const yangDiharapkan = alurBenar[jawaban.length];

                if (nama !== yangDiharapkan) {
                    setSalah(true);
                    setPesan(jawaban.length === 0
                        ? "Belum tepat. Siapa yang pertama kali meminta halaman?"
                        : `Belum tepat. Setelah ${jawaban[jawaban.length - 1]}, coba pikirkan ke mana proses berikutnya pergi.`);
                    setTimeout(() => setSalah(false), 450);
                    return;
                }

                const jawabanBaru = [...jawaban, nama];
                setJawaban(jawabanBaru);
                setSalah(false);

                if (jawabanBaru.length === alurBenar.length) {
                    setBerhasil(true);
                    setPesan("Hebat! Kamu berhasil menyusun alur web dinamis dengan tepat.");
                } else {
                    setPesan("Benar! Pilih langkah berikutnya.");
                }
            }

            function hapusTerakhir() {
                if (!jawaban.length || berhasil) return;
                setJawaban(jawaban.slice(0, -1));
                setPesan("Langkah terakhir dihapus. Silakan lanjutkan.");
            }

            function ulangi() {
                setJawaban([]);
                setBerhasil(false);
                setSalah(false);
                setPesan("Mulai dengan memilih bagian yang mengirim permintaan.");
            }

            const konfeti = useMemo(() => Array.from({ length: 38 }, (_, indeks) => ({
                id: indeks,
                kiri: (indeks * 37) % 100,
                tunda: (indeks % 9) * 0.08,
                warna: ["#38bdf8", "#8b5cf6", "#f59e0b", "#10b981", "#fb7185"][indeks % 5]
            })), []);

            return (
                <section id="kuis" className="relative overflow-hidden px-4 py-20 sm:px-6 md:py-28 lg:px-8">
                    <div className="mx-auto max-w-5xl">
                        <JudulBagian
                            nomor="5"
                            label="Mini Kuis Interaktif"
                            judul="Susun Alur Web Dinamis"
                            deskripsi="Tanpa menulis kode. Tekan tombol dalam urutan yang benar untuk menyusun perjalanan data dari awal hingga halaman tampil."
                        />

                        <div className={`${salah ? "guncang" : ""} relative overflow-hidden rounded-[2rem] border-2 ${berhasil ? "border-emerald-300 bg-emerald-50" : "border-slate-200 bg-white"} p-5 shadow-2xl shadow-slate-200/70 transition-colors sm:p-8 md:p-10`}>
                            {berhasil && (
                                <div className="pointer-events-none absolute inset-x-0 top-0 z-20 h-full overflow-hidden" aria-hidden="true">
                                    {konfeti.map((item) => (
                                        <i key={item.id} className="konfeti" style={{ left: `${item.kiri}%`, animationDelay: `${item.tunda}s`, backgroundColor: item.warna }} />
                                    ))}
                                </div>
                            )}

                            <div className="relative z-10">
                                <div className="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
                                    <div>
                                        <p className="text-sm font-bold text-slate-500">Kemajuan</p>
                                        <p className="mt-1 text-2xl font-extrabold text-slate-900">{jawaban.length} dari 5 langkah</p>
                                    </div>
                                    <div className="h-3 w-full overflow-hidden rounded-full bg-slate-100 sm:w-56">
                                        <div className={`${berhasil ? "bg-emerald-500" : "bg-sky-500"} h-full rounded-full transition-all duration-500`} style={{ width: `${(jawaban.length / 5) * 100}%` }} />
                                    </div>
                                </div>

                                <div className="mt-8 grid grid-cols-5 gap-2" aria-label="Jawaban alur web">
                                    {alurBenar.map((_, indeks) => {
                                        const isi = jawaban[indeks];
                                        const Ikon = isi === "Browser" ? Globe2 : isi === "PHP" ? ChefHat : isi === "MySQL" ? Database : null;
                                        return (
                                            <React.Fragment key={indeks}>
                                                <div className={`${isi ? "border-sky-300 bg-sky-50 text-sky-800" : "border-dashed border-slate-300 bg-slate-50 text-slate-400"} col-span-1 flex min-h-24 flex-col items-center justify-center rounded-xl border-2 p-2 text-center transition-all sm:min-h-28 sm:rounded-2xl`}>
                                                    {Ikon ? <Ikon size={22} aria-hidden="true" /> : <span className="grid h-7 w-7 place-items-center rounded-full bg-white text-xs font-extrabold shadow-sm">{indeks + 1}</span>}
                                                    <span className="mt-2 text-[10px] font-extrabold sm:text-sm">{isi || "Kosong"}</span>
                                                </div>
                                            </React.Fragment>
                                        );
                                    })}
                                </div>

                                <div className="mt-7 rounded-2xl bg-slate-50 p-5">
                                    <p className="mb-4 text-center text-sm font-bold text-slate-600">Pilih langkah berikutnya:</p>
                                    <div className="grid gap-3 sm:grid-cols-3">
                                        {pilihan.map(([nama, Ikon, gaya]) => (
                                            <button key={nama} type="button" onClick={() => pilih(nama)} disabled={berhasil} className={`${gaya} flex items-center justify-center gap-2 rounded-2xl border-2 px-4 py-4 font-extrabold transition hover:-translate-y-1 disabled:cursor-not-allowed disabled:opacity-60`}>
                                                <Ikon size={20} aria-hidden="true" /> {nama}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div className={`${berhasil ? "border-emerald-200 bg-emerald-100 text-emerald-900" : salah ? "border-rose-200 bg-rose-50 text-rose-800" : "border-sky-100 bg-sky-50 text-sky-800"} mt-5 flex min-h-20 items-center gap-3 rounded-2xl border p-4 transition-colors`} aria-live="polite">
                                    {berhasil ? <CheckCircle2 className="shrink-0" size={24} /> : salah ? <XCircle className="shrink-0" size={24} /> : <HelpCircle className="shrink-0" size={24} />}
                                    <p className="text-sm font-bold leading-6">{pesan}</p>
                                </div>

                                <div className="mt-5 flex flex-col justify-center gap-3 sm:flex-row">
                                    <button type="button" onClick={hapusTerakhir} disabled={!jawaban.length || berhasil} className="inline-flex items-center justify-center gap-2 rounded-xl border border-slate-200 bg-white px-5 py-3 text-sm font-extrabold text-slate-600 transition hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-40">
                                        <Undo2 size={17} /> Hapus Langkah Terakhir
                                    </button>
                                    <button type="button" onClick={ulangi} className="inline-flex items-center justify-center gap-2 rounded-xl bg-slate-900 px-5 py-3 text-sm font-extrabold text-white transition hover:bg-sky-700">
                                        <RotateCcw size={17} /> Mulai Ulang
                                    </button>
                                </div>

                                {berhasil && (
                                    <div className="mt-8 rounded-2xl border border-emerald-200 bg-white p-6 text-center shadow-lg">
                                        <Sparkles className="mx-auto text-amber-500" size={34} aria-hidden="true" />
                                        <h3 className="mt-3 text-2xl font-extrabold text-slate-900">Kamu sudah memahami alurnya!</h3>
                                        <p className="mx-auto mt-2 max-w-xl text-sm leading-6 text-slate-600">
                                            Browser meminta, PHP memproses, MySQL memberikan data, PHP menyusun hasil, lalu Browser menampilkannya.
                                        </p>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </section>
            );
        }

        function App() {
            useEffect(() => {
                // Target hash baru tersedia setelah React selesai merender seluruh bagian.
                // Penundaan satu bingkai memastikan tautan langsung seperti #praktik tetap bergulir tepat.
                const target = window.location.hash;
                if (target) {
                    requestAnimationFrame(() => document.querySelector(target)?.scrollIntoView());
                }
            }, []);

            return (
                <>
                    <Navigasi />
                    <main>
                        <Hero />
                        <SimulasiRestoran />
                        <BagianPekerja />
                        <BagianMySQL />
                        <BagianPraktikPHP />
                        <KuisAlur />
                    </main>
                    <footer className="border-t border-slate-200 bg-slate-950 px-4 py-10 text-center text-slate-300">
                        <div className="mx-auto flex max-w-4xl flex-col items-center">
                            <span className="grid h-12 w-12 place-items-center rounded-2xl bg-gradient-to-br from-sky-500 to-violet-500 text-white"><Code2 size={23} /></span>
                            <p className="mt-4 font-extrabold text-white">Belajar web dimulai dari memahami alurnya.</p>
                            <p className="mt-2 text-sm text-slate-400">Sekarang kamu sudah tahu apa yang terjadi di balik layar sebuah website.</p>
                            <a href="#awal" className="mt-6 inline-flex items-center gap-2 rounded-xl border border-slate-700 px-4 py-2.5 text-sm font-bold transition hover:border-sky-500 hover:text-sky-300">
                                Kembali ke Atas <ArrowDown className="rotate-180" size={16} />
                            </a>
                        </div>
                    </footer>
                </>
            );
        }

        createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
